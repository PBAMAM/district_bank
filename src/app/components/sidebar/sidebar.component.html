<aside class="sidebar" [class.open]="isOpen">

  <!-- ===== Header / Logo ===== -->
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon-wrap">
        <span class="logo-svg-letter">LT</span>
      </div>
      <div class="logo-text-group">
        <span class="logo-name"><span>Luxembourg</span>-Treasure</span>
        <span class="logo-tagline">Private Banking</span>
      </div>
    </div>
  </div>

  <!-- ===== Navigation ===== -->
  <nav class="sidebar-nav">
    <div class="nav-section">
      <p class="nav-section-title">My Banking</p>

      <a routerLink="/client/dashboard" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
        <div class="nav-icon-wrapper">🏠</div>
        <span class="nav-text">Dashboard</span>
        <span class="nav-arrow">›</span>
      </a>

      <a routerLink="/client/accounts" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
        <div class="nav-icon-wrapper">📊</div>
        <span class="nav-text">Accounts</span>
        <span class="nav-arrow">›</span>
      </a>

      <a routerLink="/client/withdrawal" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
        <div class="nav-icon-wrapper">🏧</div>
        <span class="nav-text">Withdraw</span>
        <span class="nav-arrow">›</span>
      </a>

      <a routerLink="/client/transactions" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
        <div class="nav-icon-wrapper">📈</div>
        <span class="nav-text">Transactions</span>
        <span class="nav-arrow">›</span>
      </a>

      <a routerLink="/client/kyc" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
        <div class="nav-icon-wrapper">🛡️</div>
        <span class="nav-text">KYC Verification</span>
        <span class="nav-arrow">›</span>
      </a>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-section">
      <p class="nav-section-title">Settings</p>
      <a href="javascript:void(0)" class="nav-item" (click)="closeSidebar()">
        <div class="nav-icon-wrapper">⚙️</div>
        <span class="nav-text">Preferences</span>
        <span class="nav-arrow">›</span>
      </a>
    </div>
  </nav>

</aside>
