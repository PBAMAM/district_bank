<div class="client-layout">
  <header class="client-header">
    <div class="header-left">
      <button class="mobile-menu-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="15" y2="18"></line>
        </svg>
      </button>

      <div class="breadcrumb-area">
        <p class="page-title">Client Portal</p>
        <span class="page-subtitle">Luxembourg-Treasure Banking</span>
      </div>
    </div>

    <div class="header-right">
      <!-- Warning Button (Only visible if showWarning is true) -->
      <button class="warning-action-btn" *ngIf="currentUser?.showWarning" (click)="toggleWarningModal()">
        <span class="warning-icon">⚠️</span>
        <span class="warning-text">WARNING</span>
      </button>

      <!-- Bell icon -->
      <button class="header-action-btn" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notif-dot"></span>
      </button>

      <!-- User pill -->
      <div class="user-pill">
        <div class="user-avatar">
          <span>{{ getInitials() }}</span>
        </div>
        <div class="user-details">
          <span class="welcome-text">Logged in as</span>
          <span class="user-name">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</span>
        </div>
      </div>

      <!-- Logout -->
      <button class="logout-btn" (click)="logout()">
        <svg class="logout-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2"
          fill="none">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="logout-text">Logout</span>
      </button>
    </div>
  </header>

  <div class="dashboard-content">
    <div class="sidebar-backdrop" *ngIf="isSidebarOpen" (click)="closeSidebar()"></div>
    <app-sidebar [isOpen]="isSidebarOpen" (close)="closeSidebar()"></app-sidebar>

    <main class="main-content">
      <ng-content></ng-content>
    </main>
  </div>

  <!-- Warning Modal Overaly -->
  <div class="warning-modal-overlay" *ngIf="isWarningModalOpen" (click)="toggleWarningModal()">
    <div class="warning-modal-content" (click)="$event.stopPropagation()">
      <div class="warning-modal-header">
        <div class="warning-title-group">
          <span class="warning-icon-large">⚠️</span>
          <h2>Important Warning</h2>
        </div>
        <button class="close-btn" (click)="toggleWarningModal()">×</button>
      </div>
      <div class="warning-modal-body">
        <p class="custom-warning-text">{{ currentUser?.customWarningMessage || 'Please contact administrator for more
          details.' }}</p>
      </div>
      <div class="warning-modal-footer">
        <button class="btn btn-acknowledge" (click)="toggleWarningModal()">I understand</button>
      </div>
    </div>
  </div>
</div>
